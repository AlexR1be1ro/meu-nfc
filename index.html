<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Entre em contato</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    background: linear-gradient(135deg, #25d366, #128c7e);
}

.container {
    width: 90%;
    max-width: 400px;

    text-align: center;
}

h1 {
    font-size: 48px;
    color: #DCF8C6;

    margin-bottom: 10px;
}

.subtitulo {
    color: white;
    font-size: 25px;
    margin-bottom: 30px;
}

.botao {

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    width: 50%;

    height: 170px;
    margin-left: auto;
    margin-right: auto;
    margin-bottom: 40px;

    background: #DCF8C6;

    border-radius: 25px;

    text-decoration: none;

    box-shadow:
        0 5px 20px rgba(0,0,0,0.12);

    transition: 0.2s;
}

.botao:hover {

    transform: scale(1.03);
}

.logo {

    width: 100px;

    height: 100px;

    margin-bottom: 15px;
}

.clique {

    font-size: 18px;

    font-weight: bold;

    color: #333;
}

.whatsapp .logo {

    fill: #25D366;
}

.instagram .logo {

    fill: #E1306C;
}

</style>

</head>


<body>

<div class="container">

    <h1>Entre em contato</h1>

    <p class="subtitulo">
        Escolha uma opção abaixo
    </p>


    <!-- WHATSAPP -->

    <a
        class="botao whatsapp"
        href="https://wa.me/SEUNUMERO"
        target="_blank"
    >

        <svg
            class="logo"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
        >

            <path d="M12 2C6.48 2 2 6.48 2 12c0 1.76.46 3.41 1.26 4.86L2 22l5.28-1.23A9.96 9.96 0 0 0 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm0 18c-1.56 0-3.04-.4-4.35-1.1l-.31-.17-3.13.73.74-3.05-.18-.32A7.96 7.96 0 1 1 12 20zm4.37-5.97c-.24-.12-1.42-.7-1.64-.78-.22-.08-.38-.12-.54.12-.16.24-.62.78-.76.94-.14.16-.28.18-.52.06-.24-.12-1.01-.37-1.92-1.18-.71-.63-1.19-1.41-1.33-1.65-.14-.24-.01-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78-.2-.47-.4-.41-.54-.42h-.46c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.69 2.58 4.1 3.62.57.25 1.02.4 1.37.51.58.18 1.1.15 1.51.09.46-.07 1.42-.58 1.62-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28z"/>

        </svg>

        <span class="clique">
            Clique aqui
        </span>

    </a>


    <!-- INSTAGRAM -->

    <a
        class="botao instagram"
        href="https://instagram.com/3d_alex_projects"
        target="_blank"
    >

        <svg
            class="logo"
            viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg"
        >

            <path d="M7 2C4.24 2 2 4.24 2 7v10c0 2.76 2.24 5 5 5h10c2.76 0 5-2.24 5-5V7c0-2.76-2.24-5-5-5H7zm0 2h10c1.66 0 3 1.34 3 3v10c0 1.66-1.34 3-3 3H7c-1.66 0-3-1.34-3-3V7c0-1.66 1.34-3 3-3zm5 3.5A4.5 4.5 0 1 0 16.5 12 4.5 4.5 0 0 0 12 7.5zm0 7A2.5 2.5 0 1 1 14.5 12 2.5 2.5 0 0 1 12 14.5zM17.5 6.5a1 1 0 1 0 1 1 1 1 0 0 0-1-1z"/>

        </svg>

        <span class="clique">
            Clique aqui
        </span>

    </a>

</div>

</body>

</html>
